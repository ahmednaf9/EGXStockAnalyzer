name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "Runner OS: $RUNNER_OS"
          echo "ANDROID_HOME from runner: ${ANDROID_HOME:-not set}"
          SDKMANAGER=""
          for ROOT in "${ANDROID_HOME:-}" /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk; do
            if [ -n "$ROOT" ] && [ -d "$ROOT" ]; then
              SDKMANAGER="$(find "$ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
              if [ -n "$SDKMANAGER" ]; then
                break
              fi
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate sdkmanager in the standard Android SDK locations."
            echo "Available directories:"
            ls -la /usr/local/lib/android /opt /usr/lib/android 2>/dev/null || true
            exit 1
          fi

          SDK_ROOT="${SDKMANAGER%%/cmdline-tools/*}"
          if [ "$SDK_ROOT" = "$SDKMANAGER" ]; then
            echo "Unexpected sdkmanager path: $SDKMANAGER"
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          echo "Using SDK root: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EGXStockAnalyzer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
